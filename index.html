<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> ENSALADA DE FRUTA </title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<header>
    <h1>ENSALADA DE FRUTA</h1>

    <nav>
        <a href="#inicio">Inicio</a>
        <a href="#productos">Productos</a>
        <a href="#contacto">Contacto</a>
    </nav>
</header>

<main class="contenedor">

    <section id="inicio">
        <h2>Bienvenidos</h2>
        <p>Disfruta , postres y bebidas preparadas al momento.</p>
    </section>

    <section id="productos">
        <h2>Productos</h2>

        <ul>
            <li>Café Americano - Bs 12</li>
            <li>Capuchino - Bs 18</li>
            <li>Torta de Chocolate - Bs 20</li>
        </ul>
    </section>

    <section id="contacto">
        <h2>Contacto</h2>

        <form id="formulario">
            <input type="text" placeholder="Nombre" required>
            <input type="email" placeholder="Correo" required>
            <textarea placeholder="Mensaje" required></textarea>
        </form>

        <button id="boton">Enviar</button>

        <p id="mensaje" class="oculto"></p>
    </section>

</main>

<script src="script.js"></script>

</body>
</html>
